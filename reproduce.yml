name: Numerical reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Mathematical identities and input validation
        run: python -m unittest discover -s tests -v
      - name: Regenerate all numerical illustrations
        run: python reproduce.py --output-dir build/reproduction
      - name: Compare regenerated data with the reference
        run: python verify_reproduction.py --generated build/reproduction
